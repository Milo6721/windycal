<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Windy</title>
<meta name="description" content="A calm calorie counter. Write what you ate, in plain words.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Windy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script>
  // Set the theme before first paint so there is no flash.
  (function () {
    var m = 'auto';
    try { m = (JSON.parse(localStorage.getItem('windy.v1') || '{}').settings || {}).theme || 'auto'; } catch (e) {}
    var dark = m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.mode = dark ? 'dark' : 'light';
  })();
</script>
<link rel="stylesheet" href="css/windy.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1 aria-label="Windy"><span style="--i:0">W</span><span style="--i:1">i</span><span style="--i:2">n</span><span style="--i:3">d</span><span style="--i:4">y</span></h1>
      <svg class="wind" viewBox="0 0 44 22" aria-hidden="true">
        <path pathLength="40" d="M0 6h24a3.4 3.4 0 1 0-3.4-3.4"/>
        <path pathLength="40" d="M0 11.5h35a3.6 3.6 0 1 1-3.6 3.6"/>
        <path pathLength="40" d="M0 17h15a2.6 2.6 0 1 1-2.6 2.6"/>
      </svg>
    </div>
    <nav class="days" id="days" aria-label="View">
      <span class="pill" id="pill"></span>
      <button data-view="yesterday"></button>
      <button data-view="today" class="on"></button>
      <button data-view="tomorrow"></button>
      <button data-view="weekly"></button>
    </nav>
    <div class="hbtns">
      <button class="icon-btn" id="setbtn"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
  </header>

  <main id="scroll">
    <div class="head">
      <h2 id="title"></h2>
      <p id="dateline"></p>
      <p id="eaten"></p>
    </div>
    <section id="log" class="log" aria-label="Food log"></section>
    <section id="weekly" class="weekly" hidden></section>
  </main>

  <footer class="bar" id="bar">
    <div class="b-left">
<div class="ring-wrap">      <svg class="ring" viewBox="0 0 48 48" aria-hidden="true">
        <circle class="ring-bg" cx="24" cy="24" r="20"/>
        <circle class="ring-fg" id="ring" cx="24" cy="24" r="20" stroke-dasharray="125.66" stroke-dashoffset="125.66"/>
      </svg><span class="ring-in" id="ringIn"><b></b><i></i></span></div>
      <div class="b-kcal">
        <div class="big"><b id="bEaten">0</b><span> / <i id="bGoal">0</i></span></div>
        <div class="small" id="bLeft"></div>
      </div>
    </div>
    <button class="water" id="water" type="button"><b>0 ml</b></button>
    <div class="b-right">
      <div class="mac" data-m="protein"><b><i class="n">0</i> g</b><span class="lbl"></span><em><u></u></em></div>
      <div class="mac" data-m="carbs"><b><i class="n">0</i> g</b><span class="lbl"></span><em><u></u></em></div>
      <div class="mac" data-m="fat"><b><i class="n">0</i> g</b><span class="lbl"></span><em><u></u></em></div>
    </div>
  </footer>
</div>

<div id="setsheet" class="sheet"><div class="card" id="setcard" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <clipPath id="glassclip"><path d="M5.35 4.25h13.3l-1.66 20.15a2 2 0 0 1-2 1.85H9.01a2 2 0 0 1-2-1.85z"/></clipPath>
</defs></svg>

<script type="module" src="js/app.js"></script>
</body>
</html>
